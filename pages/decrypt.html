<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déchiffrer un message</title>
    <link rel="stylesheet" href="../style/style.css">
    <script type="text/javascript" src="../script/script.js" defer></script> 
</head>
<body>
    <header>
        <h1>Déchiffrer</h1>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="info.html">Infos</a>
            <a href="encrypt.html">Chiffrer</a>
            <a href="decrypt.html">Déchiffrer</a>
            <a href="history.html">Historique</a>
        </nav>
    </header>
    <main>
        <h2>Déchiffrer un message</h2>
        <form id="decrypt-form">
            <label for="algorithme">Choisissez un algorithme: </label>
            <select id="algorithme" name="algorithme">
                <option value="">--Veuillez choisir une option--</option>
                <option value="cesar">César</option>
                <option value="vigenere">Vigenère</option>
                <option value="xor">XOR</option>
            </select>

            <label for="message">Message chiffré: </label>
            <textarea id="message" name="message" placeholder="Entrez votre message à déchiffrer ici..." required></textarea>

            <label for="cle">Clé: </label>
            <input type="text" id="cle" name="cle" placeholder="Entrez votre clé ici..." required> <br/>

            <button type="submit">Déchiffrer</button>
        </form>
        <div id="resultat"></div>
    </main>
</body>
</html>
